name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Strict rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: Check tutorial binaries
        run: cargo check --manifest-path examples/Cargo.toml --bins
      - name: Check indexed research package formatting
        run: cargo fmt --manifest-path experiments/indexed_access/Cargo.toml --all -- --check
      - name: Lint indexed research package
        run: cargo clippy --manifest-path experiments/indexed_access/Cargo.toml --all-targets -- -D warnings
      - name: Test indexed research package
        run: cargo test --manifest-path experiments/indexed_access/Cargo.toml
      - name: Verify release and package contents
        run: scripts/publish-crate.sh --check-only

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85
      - name: Check minimum Rust version
        run: cargo check --all-targets
      - name: Check tutorial binaries
        run: cargo check --manifest-path examples/Cargo.toml --bins

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check RustSec advisories
        run: |
          cargo audit
          cargo audit --file examples/Cargo.lock
